[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ammper"
version = "2.0"
description = "Microbial Population Radiation Simulation"
readme = "README.md"
requires-python = ">=3.9,<3.12"
authors = [
    {name = "Danny Mejia", email = "danny.a.mejia@nasa.gov"},
]
dependencies = [
    "matplotlib==3.7.2",
    "moviepy==1.0.3",
    "numpy==1.25.2",
    "pandas==2.1.0",
    "PyQt5==5.15.11",
    "rich>=13.0",
    "scikit-learn==1.3.0",
    "scipy==1.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ammper = "ammper.cli:main"

[tool.setuptools]
packages = ["ammper"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["bin", "data", "radiationData", "images", "figures", "results", "venv"]

[tool.ruff.lint]
# Deliberately narrow: the standard pyflakes/pycodestyle-error set plus import
# sorting. The legacy analysis/GUI scripts carry a backlog of pre-existing
# findings under a broader ruleset; that cleanup is a separate, reviewed pass.
select = ["E4", "E7", "E9", "F", "I"]
